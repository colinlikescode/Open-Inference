[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "servepilot"
version = "1.0.0"
description = "Open BaseTen: autonomous, verified inference optimization on existing NVIDIA GPU machines."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "ServePilot contributors" }]
keywords = ["llm", "inference", "vllm", "sglang", "gpu", "benchmark", "tensor-parallel"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  # Router hot path: C HTTP parser for uvicorn and a libuv event loop (see cli/common.run_async).
  "httptools>=0.6",
  "uvloop>=0.19; sys_platform != 'win32'",
  "huggingface_hub>=0.24",
  "safetensors>=0.4.3",
  "tokenizers>=0.19",
  "nvidia-ml-py>=12.555",
  "psutil>=5.9",
  "prometheus-client>=0.20",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Full Hugging Face tokenizer coverage (slow/sentencepiece tokenizers without tokenizer.json).
hf = ["transformers>=4.44"]
# Optional runtime for inference configurations that use Ray.
ray = ["ray>=2.30"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-psutil",
  "openai>=1.40",
  "numpy>=1.26",
]

[project.scripts]
servepilot = "servepilot.cli:main"
openbaseten = "servepilot.cli:main"

[project.urls]
Homepage = "https://github.com/colinlikescode/Open-Baseten-Inference"
Documentation = "https://github.com/colinlikescode/Open-Baseten-Inference/tree/main/docs"
Issues = "https://github.com/colinlikescode/Open-Baseten-Inference/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/servepilot"]

[tool.hatch.build.targets.sdist]
include = ["src/servepilot", "README.md", "instructions.md", "docs", "examples", "LICENSE", "SECURITY.md", "pyproject.toml"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplify
  "C4",  # comprehensions
  "RUF", # ruff-specific
  "PT",  # pytest style
  "ASYNC",
]
ignore = [
  "E501",   # line length handled by formatter
  "B008",   # typer uses function calls in defaults
  "RUF012", # mutable class attributes (pydantic handles this)
  "SIM108", # ternary is not always clearer
  "PT011",  # pytest.raises(...) without match is fine when the exception type is specific
  "RUF001", # allow unicode punctuation in strings for CLI output
  "RUF002", # allow unicode in docstrings (formulas use × and –)
  "RUF003", # allow unicode in comments
  "ASYNC109", # explicit timeout parameters are part of the ProcessHandle protocol
  "PT018",  # compound assertions are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["servepilot"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["servepilot"]

[[tool.mypy.overrides]]
module = ["pynvml", "pynvml.*", "transformers", "transformers.*", "tokenizers", "tokenizers.*", "ray", "ray.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 180
markers = [
  "gpu: requires real NVIDIA hardware and an installed inference engine (never run in CI)",
  "e2e: spawns real subprocesses (fake engine backends) and exercises the full loop",
]
filterwarnings = [
  "error::RuntimeWarning:servepilot",
]
addopts = "-ra -m 'not gpu'"

[tool.coverage.run]
source = ["servepilot"]
branch = true
omit = [
  "src/servepilot/hardware/nvml.py",
  "src/servepilot/testing/*",
  "src/servepilot/__main__.py",
]

[tool.coverage.report]
skip_covered = false
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
