name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Pi for compatible-endpoint integration tests
        run: npm install -g @earendil-works/pi-coding-agent@0.83.0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ray]"
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Unit tests
        run: pytest tests/unit -q --cov=servepilot --cov-report=xml
      - name: Integration tests
        run: pytest tests/integration -q
      - name: End-to-end tests (fake engine, real subprocesses)
        run: pytest tests/e2e -q
      - name: Package builds
        run: |
          pip install build
          python -m build
